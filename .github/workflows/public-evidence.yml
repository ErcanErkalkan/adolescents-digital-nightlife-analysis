name: DSIS 2026 public evidence integrity
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  public-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public analytical dependencies
        run: python -m pip install --disable-pip-version-check -r dsis2026/requirements.txt
      - name: Check script syntax
        run: python -m compileall -q dsis2026
      - name: Validate reported evidence without raw participant data
        run: python dsis2026/validate_public_evidence.py
